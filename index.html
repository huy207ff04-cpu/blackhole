<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="vignette"></div>
    <div id="overlay">
      <div class="header">
        <div class="title" id="main-title">Stable Singularity</div>
        <div class="status-pill" id="status-text">Topology: Nominal</div>
      </div>
      <div class="hud-bottom">
        <div>
          <div class="metric">
            MASS_INDEX: <span class="val">4.2M SOL</span>
          </div>
          <div class="metric">
            LENSING: <span class="val" id="lensing-val">SCHWARZSCHILD</span>
          </div>
        </div>
        <div style="text-align: right">
          <div class="metric">
            RELATIVITY: <span class="val" id="vel-val">0.45c</span>
          </div>
          <div class="metric">
            RADIATION: <span class="val">DETECTION ON</span>
          </div>
        </div>
      </div>
</div>
</body>
</html>
